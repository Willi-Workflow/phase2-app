<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Phase II · Mission</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="stil.css?v=91">
<link rel="preload" as="image" href="bilder/hangartuer.jpg">
</head>
<body>
<button class="zurueck" onclick="location.href='uebersicht.html'">◄ ÜBERSICHT</button>
<main style="padding-top:max(7vh, 80px);">
  <h1 class="she-titel" id="missionstitel"></h1>
  <p class="she-untertitel" id="missionsnummer"></p>
  <div class="missionsraster" id="missionsraster">
    <section class="missionsfeld">
      <h2>MISSION</h2>
      <p id="uebungshinweis" style="font-size:13px;color:var(--gedeckt);letter-spacing:.05em;">
        Die echte Übung entsteht in einem eigenen Bauabschnitt. Der Probelauf prüft Speicherung,
        Auswertung und Vergleich: 10 Sekunden, jeder Klick oder Knopfdruck zählt einen Punkt.
      </p>
      <div id="uebungsfeld"></div>
      <button class="startknopf" id="start">START</button>
      <p class="probehinweis" id="probehinweis" hidden>PROBEBETRIEB · LÄUFE WERDEN NICHT GEWERTET</p>
      <div class="geraetestand" id="geraetestand"></div>
    </section>
    <section class="missionsfeld" id="auswertungsfeld">
      <h2>AUSWERTUNG</h2>
      <div class="diagramm" id="diagramm" hidden>
        <div class="diagrammlegende" id="diagrammlegende"></div>
        <div class="diagrammkoerper">
          <svg class="achsensvg" id="achsensvg" viewBox="0 0 34 172"></svg>
          <div class="diagrammrollen" id="diagrammrollen"><div class="diagrammflaeche" id="diagrammflaeche"></div></div>
        </div>
      </div>
      <div class="kennzeile"><span>Bestwert</span><b id="bestwert">–</b></div>
      <div class="kennzeile"><span>Durchschnitt</span><b id="durchschnitt">–</b></div>
      <div class="balkenpaar" id="vergleich"></div>
    </section>
  </div>
  <div id="uebungsunten"></div>
</main>
<script type="module" src="js/mission.js?v=117"></script>
</body>
</html>
