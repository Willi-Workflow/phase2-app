<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Retro-Rechner · Varianten</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; background: #0d1109; color: #e6e3d5; font-family: system-ui, sans-serif; }
  h1 { text-align: center; font-size: 18px; letter-spacing: 0.2em; padding: 24px 0 6px; font-weight: 600; }
  h1.klein { font-size: 13px; color: #9aa08c; }
  p { text-align: center; font-size: 13px; color: #9aa08c; margin: 0 0 18px; }
  .reihe { display: flex; gap: 24px; justify-content: center; align-items: flex-start; flex-wrap: wrap; padding: 0 24px 40px; }
  .spalte { flex-direction: column; align-items: center; }
  figure { margin: 0; width: min(400px, 90vw); }
  .gross { width: min(1200px, 94vw); }
  img { width: 100%; border-radius: 8px; display: block; }
  figcaption { text-align: center; padding: 10px 0; font-size: 14px; letter-spacing: 0.12em; }
  .probe { position: relative; }
  .frageprobe { position: absolute; left: 50%; transform: translateX(-50%); color: #1a1a1a; font-family: "Courier New", monospace; font-weight: 700; text-align: center; }
  .feldprobe { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; font-family: "Courier New", monospace; font-weight: 700; color: #1a1a1a; }
  .feldprobe .kasten { border: 2px solid #1a1a1a; padding: 6px 14px; min-width: 110px; text-align: right; }
  .feldprobe .strich { animation: blinken 1s steps(1) infinite; }
  @keyframes blinken { 50% { opacity: 0; } }
</style>
</head>
<body>
<h1>RETRO-RECHNER FÜR MISSION 5 · RUNDE 3</h1>
<p>Größerer, etwas neuerer Bildschirm auf dem Fliegerschreibtisch. Frage und Eingabefeld liegen zur Probe auf der Mattscheibe.</p>
<div class="reihe spalte">
  <figure class="gross">
    <div class="probe"><img src="bilder/rechner-entwurf-7.png" alt="Variante 7, große Röhre um 2000">
      <span class="frageprobe" style="top:22%;width:30%;font-size:clamp(10px,1.2vw,17px);">DAS LUFTFAHRZEUG FLIEGT 120 KT. DAS ZIEL LIEGT 24 NM ENTFERNT. BERECHNE DIE FLUGZEIT IN MINUTEN.</span>
      <div class="feldprobe" style="top:46%;font-size:clamp(10px,1.3vw,18px);"><span class="kasten">12<span class="strich">▌</span></span><span>min</span></div>
    </div>
    <figcaption>VARIANTE 7 · GROSSE RÖHRE UM 2000 (fast flache Scheibe, schmaler Rahmen)</figcaption>
  </figure>
  <figure class="gross">
    <div class="probe"><img src="bilder/rechner-entwurf-8.png" alt="Variante 8, Flachbildschirm Anfang 2000er">
      <span class="frageprobe" style="top:20%;width:34%;font-size:clamp(10px,1.3vw,18px);">DAS LUFTFAHRZEUG FLIEGT 120 KT. DAS ZIEL LIEGT 24 NM ENTFERNT. BERECHNE DIE FLUGZEIT IN MINUTEN.</span>
      <div class="feldprobe" style="top:44%;font-size:clamp(10px,1.4vw,19px);"><span class="kasten">12<span class="strich">▌</span></span><span>min</span></div>
    </div>
    <figcaption>VARIANTE 8 · FLACHBILDSCHIRM ANFANG 2000ER (größte Schriftfläche, Headset mit Mikrofon)</figcaption>
  </figure>
</div>
<h1 class="klein">RUNDE 2 (ZURÜCKGESTELLT)</h1>
<div class="reihe">
  <figure><img src="bilder/rechner-entwurf-4.png" alt="Variante 4"><figcaption>VARIANTE 4 · WARMES BÜRO</figcaption></figure>
  <figure><img src="bilder/rechner-entwurf-5.png" alt="Variante 5"><figcaption>VARIANTE 5 · NÜCHTERNES BÜRO</figcaption></figure>
  <figure><img src="bilder/rechner-entwurf-6.png" alt="Variante 6"><figcaption>VARIANTE 6 · FLIEGERSCHREIBTISCH</figcaption></figure>
</div>
<h1 class="klein">RUNDE 1 (ZURÜCKGESTELLT)</h1>
<div class="reihe">
  <figure><img src="bilder/rechner-entwurf-1.png" alt="Variante 1"><figcaption>VARIANTE 1 · MILITÄRKONSOLE</figcaption></figure>
  <figure><img src="bilder/rechner-entwurf-2.png" alt="Variante 2"><figcaption>VARIANTE 2 · FELDRECHNER</figcaption></figure>
  <figure><img src="bilder/rechner-entwurf-3.png" alt="Variante 3"><figcaption>VARIANTE 3 · 80ER-TERMINAL</figcaption></figure>
</div>
</body>
</html>
