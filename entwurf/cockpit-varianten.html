<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cockpit · Varianten</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; background: #0d1109; color: #e6e3d5; font-family: system-ui, sans-serif; }
  h1 { text-align: center; font-size: 18px; letter-spacing: 0.2em; padding: 24px 0 6px; font-weight: 600; }
  p { text-align: center; font-size: 13px; color: #9aa08c; margin: 0 0 18px; }
  .reihe { display: flex; flex-direction: column; gap: 26px; align-items: center; padding: 0 24px 40px; }
  figure { margin: 0; width: min(1200px, 94vw); }
  img { width: 100%; border-radius: 8px; display: block; }
  figcaption { text-align: center; padding: 10px 0; font-size: 14px; letter-spacing: 0.12em; }
  .probe { position: relative; }
  .instrprobe { position: absolute; display: flex; gap: 1.5%; }
  .instrprobe i { flex: 1; aspect-ratio: 1; border-radius: 50%; background: #11150e; border: 2px solid #767c68; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5), inset 0 0 0 4px #1c2115; }
</style>
</head>
<body>
<h1>COCKPIT FÜR MISSION 4 · RUNDE 2 (DIAMOND-STIL)</h1>
<p>Blick leicht zu den Instrumenten geneigt, Außensicht unscharf. Die fünf Kreise deuten die Instrumentenreihe an.</p>
<div class="reihe">
  <figure>
    <div class="probe"><img src="bilder/cockpit-entwurf-4.png" alt="Variante 4, Kuppelhaube bei Tag">
      <div class="instrprobe" style="left:22%;top:68%;width:56%;"><i></i><i></i><i></i><i></i><i></i></div></div>
    <figcaption>VARIANTE 4 · KUPPELHAUBE BEI TAG (helles Verbundpanel, grüne Landschaft)</figcaption>
  </figure>
  <figure>
    <div class="probe"><img src="bilder/cockpit-entwurf-5.png" alt="Variante 5, stärker geneigter Blick">
      <div class="instrprobe" style="left:27%;top:60%;width:46%;"><i></i><i></i><i></i><i></i><i></i></div></div>
    <figcaption>VARIANTE 5 · STÄRKER GENEIGTER BLICK (dunkles rundes Panel dominiert)</figcaption>
  </figure>
  <figure>
    <div class="probe"><img src="bilder/cockpit-entwurf-6.png" alt="Variante 6, Kuppelhaube im Abendlicht">
      <div class="instrprobe" style="left:31%;top:52%;width:38%;"><i></i><i></i><i></i><i></i><i></i></div></div>
    <figcaption>VARIANTE 6 · KUPPELHAUBE IM ABENDLICHT (Lederblendschutz, Wald ringsum)</figcaption>
  </figure>
</div>
<h1 style="font-size:13px;color:#9aa08c;">RUNDE 1 (ZURÜCKGESTELLT)</h1>
<div class="reihe">
  <figure>
    <div class="probe"><img src="bilder/cockpit-entwurf-1.png" alt="Variante 1, Jet bei Tag">
      <div class="instrprobe" style="left:17%;top:66%;width:66%;"><i></i><i></i><i></i><i></i><i></i></div></div>
    <figcaption>VARIANTE 1 · JET BEI TAG (helle Wolkensicht, breites Panel)</figcaption>
  </figure>
  <figure>
    <div class="probe"><img src="bilder/cockpit-entwurf-2.png" alt="Variante 2, Jet bei Dämmerung">
      <div class="instrprobe" style="left:29%;top:62%;width:42%;"><i></i><i></i><i></i><i></i><i></i></div></div>
    <figcaption>VARIANTE 2 · JET BEI DÄMMERUNG (Abendhimmel, dunkles Panel)</figcaption>
  </figure>
  <figure>
    <div class="probe"><img src="bilder/cockpit-entwurf-3.png" alt="Variante 3, Trainer über Land">
      <div class="instrprobe" style="left:16%;top:70%;width:68%;"><i></i><i></i><i></i><i></i><i></i></div></div>
    <figcaption>VARIANTE 3 · TRAINER ÜBER LAND (grüne Landschaft, runde Blendkante)</figcaption>
  </figure>
</div>
</body>
</html>
