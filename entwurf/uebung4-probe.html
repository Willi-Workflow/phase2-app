<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Übung 4 · Probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../stil.css?v=37">
</head>
<body>
<script type="module">
  // Probeaufbau ohne App-Rahmen: startet die Übung sofort mit festen
  // Einstellungen, damit der Ablauf headless mit virtueller Zeit prüfbar ist.
  // Mit ?abbruch=<ms> wird nach dieser Zeit der Abbruchweg ausgelöst.
  import { erzeugeUebung4 } from "../js/uebung4-lauf.js";
  const speicher = {
    ladeEinstellung: async () => ({ zeit: 3, fragen: 2, dauer: 5 }),
    setzeEinstellung: async () => {},
  };
  const uebung = erzeugeUebung4({ speicher });
  await uebung.ladeEinstellung();
  let brichAb = null;
  uebung.starte({
    registriereAbbruch: (fn) => { brichAb = fn; },
    beiEnde: (ergebnis) => { document.body.textContent = `ENDE: ${JSON.stringify(ergebnis)}`; },
  });
  const abbruchNach = Number(new URLSearchParams(location.search).get("abbruch"));
  if (abbruchNach > 0) setTimeout(() => brichAb?.(), abbruchNach);
</script>
</body>
</html>
