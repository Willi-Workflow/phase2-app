<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Übung 4 · Probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../stil.css?v=46">
</head>
<body>
<script type="module">
  // Probeaufbau ohne App-Rahmen: schließt die Hangartür und startet die Übung
  // sofort mit festen Einstellungen, damit der Ablauf headless mit virtueller
  // Zeit prüfbar ist. Mit ?abbruch=<ms> wird nach dieser Zeit abgebrochen.
  import { erzeugeUebung4 } from "../js/uebung4-lauf.js";
  import { erzeugeHangartuer } from "../js/hangartuer.js";
  const speicher = {
    ladeEinstellung: async () => ({ zeit: 3, fragen: 2, dauer: 5 }),
    setzeEinstellung: async () => {},
  };
  const uebung = erzeugeUebung4({ speicher });
  await uebung.ladeEinstellung();
  const tuer = erzeugeHangartuer();
  let brichAb = null;
  await tuer.schliesse();
  uebung.starte({
    tuer,
    registriereAbbruch: (fn) => { brichAb = fn; },
    beiEnde: (ergebnis) => { document.body.insertAdjacentText("beforeend", `ENDE: ${JSON.stringify(ergebnis)}`); },
  });
  const abbruchNach = Number(new URLSearchParams(location.search).get("abbruch"));
  if (abbruchNach > 0) setTimeout(() => brichAb?.(), abbruchNach);
</script>
</body>
</html>
